name: CI

# Runs the LLM-free R1–R16 registry validator and checks that the shipped
# mizan.skill stays in sync with skill/mizan/. This is the static-check
# automation of the already-shipped tool (FEAT-M001's cheap alternative) —
# NOT the "full CI/CD gate with an LLM auditor", which stays gated.
#
# R4 (append-only) needs a BASELINE to compare against, and until now this
# workflow never supplied one: _append_only() only runs when --against is
# passed, so the rule enforcing "refuted entries are never deleted" was
# written, tested, and never executed by any automated run. It runs now.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # R4 diffs the registry against its baseline commit; the default
          # shallow clone has no such commit to reach.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Resolve the R4 append-only baseline
        id: baseline
        run: |
          set -e
          # On a PR the baseline is the target branch; on a push to main it is
          # the previous commit. Resolved in its own step and ECHOED, because
          # the tool degrades silently when a baseline cannot be read — a
          # skipped check that prints nothing is indistinguishable from a
          # passing one, which is the failure this whole change is about.
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "R4 baseline: $base ($(git rev-parse --short "$base"))"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "::warning::No baseline commit reachable — R4 (append-only) did NOT run."
          fi

      - name: Validate every registry (R1–R16, R4 against the baseline)
        run: |
          set -e
          base="${{ steps.baseline.outputs.base }}"
          found=0
          while IFS= read -r f; do
            found=1
            rel="${f#./}"          # git show wants a repo-relative path
            # --strict only where the file's job is to MODEL the discipline:
            # the schema, the template, and the worked examples. Everywhere
            # else warnings stay advisory, because a warning the maintainer
            # has not acted on yet should not block an unrelated PR -- and a
            # warning that blocks is just a rule with a softer name.
            strict=""
            case "$rel" in
              examples/*|templates/*|skill/*) strict="--strict" ;;
            esac
            echo "::group::$rel ${strict:-(advisory)}"
            if [ -n "$base" ]; then
              python tools/mizan_validate.py $strict --against "$base" "$rel"
            else
              python tools/mizan_validate.py $strict "$rel"
            fi
            echo "::endgroup::"
          done < <(find . -path ./.git -prune -o -name '*mizan-registry*.y*ml' -print)
          if [ "$found" -eq 0 ]; then
            echo "No registry files found to validate." >&2
            exit 1
          fi

      - name: Self-test — the warning channel warns without blocking
        run: |
          set -e
          # A warning that blocks is a rule; a rule that cannot block is
          # decoration. This checks the channel is genuinely two-valued:
          # exit 0 by default, exit 1 under --strict, same finding both times.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: "P", schema_version: "1.2"}
          hypotheses:
            - id: "H-001"
              tier: "H"
              formal: "a claim"
              arbiter: {class: runtime, who: "pytest"}
          experiments: []
          results: []
          YAML
          out="$(python tools/mizan_validate.py "$tmp")"   # must exit 0
          echo "$out"
          echo "$out" | grep -q "W1:" || { echo "FAIL: W1 did not warn" >&2; exit 1; }
          echo "$out" | grep -q "W2:" || { echo "FAIL: W2 did not warn" >&2; exit 1; }
          if strict_out="$(python tools/mizan_validate.py --strict "$tmp")"; then
            echo "FAIL: --strict did not promote warnings to failures" >&2
            exit 1
          fi
          echo "$strict_out"
          # Same finding both times, by name. A non-zero exit alone would let
          # --strict "pass" this step while failing on some unrelated rule,
          # which would prove nothing about the promotion path.
          echo "$strict_out" | grep -q "W1:" || { echo "FAIL: --strict failed, but W1 is not what it promoted" >&2; exit 1; }
          echo "$strict_out" | grep -q "W2:" || { echo "FAIL: --strict failed, but W2 is not what it promoted" >&2; exit 1; }
          echo "OK: warnings warn by default and fail under --strict, on W1 and W2 both times."

      - name: Self-test — R16 must reject a coverage claim before reconciliation
        run: |
          set -e
          # The Coverage Ledger is the one deliverable that decides a tier.
          # It used to live in a Markdown table, so this rule could not exist.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: "P", schema_version: "1.5"}
          hypotheses: []
          coverage:
            target: "big repo"
            claim_tier: "K"
            phases:
              - {id: "P0", slice: "scoping", status: "done"}
              - {id: "P1", slice: "auth", status: "done"}
              - {id: "P2", slice: "billing", status: "in_progress"}
          YAML
          out="$(python tools/mizan_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "R16:" || { echo "FAIL: R16 did not fire on an unfinished phase" >&2; exit 1; }
          echo "$out" | grep -q "W4:" || { echo "FAIL: W4 did not warn about the missing MERGE row" >&2; exit 1; }
          # finishing every slice is still not finishing the audit
          sed -i 's/status: "in_progress"/status: "done"/' "$tmp"
          out="$(python tools/mizan_validate.py "$tmp" || true)"
          echo "$out" | grep -q "no MERGE row" || { echo "FAIL: R16 accepted slices-done as target-done" >&2; exit 1; }
          echo "OK: R16 holds the coverage claim until reconciliation runs."

      - name: Self-test — R9/R10/R11/R12 must reject an unearned [K]
        run: |
          set -e
          # This fixture is PROSE-SCHEMA-AUDIT.md's Kanit-A and Kanit-B
          # merged: a tier written with no evidence, a threshold that names
          # no quantity, an entry with no tier at all, and missing mandatory
          # fields. It validated clean through schema 1.3.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: "P", schema_version: "1.4"}
          hypotheses:
            - id: "H-001"
              threshold: {support: "improves things", refute: "does not improve things"}
              refutation: "if it does not improve"
              arbiter: {class: runtime, who: "pytest"}
            - id: "H-002"
              tier: "K"
              formal: "X works."
              metric: {name: "m"}
              cost: "1 day"
              status: "closed"
              threshold: {support: ">= 5%", refute: "< 1%"}
              refutation: "below 1%"
              prior_art: []
              arbiter: {class: third_party, who: "reviewer", calibration: "reviewer null"}
          experiments: []
          results: []
          YAML
          out="$(python tools/mizan_validate.py "$tmp" || true)"
          echo "$out"
          for rule in "R9:" "R10:" "R11:" "R12:"; do
            echo "$out" | grep -q "$rule" || { echo "FAIL: $rule did not fire" >&2; exit 1; }
          done
          echo "OK: R9, R10, R11 and R12 all fired."
          sed -i 's/schema_version: "1.4"/schema_version: "1.3"/' "$tmp"
          python tools/mizan_validate.py "$tmp"
          echo "OK: the same registry at 1.3 stays valid and unenforced."

      - name: Self-test — R13/R14/R15 must reject a free-form feature and bug
        run: |
          set -e
          # Until schema 1.3 these two blocks were validated for nothing but
          # tier spelling, so a feature with no kill condition, no
          # alternatives and no arbiter sat at [K] unchallenged. If this step
          # ever stops failing, Modes 4 and 5 are unenforced again.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: "P", schema_version: "1.3"}
          hypotheses: []
          experiments: []
          results: []
          features:
            - id: "FEAT-001"
              tier: "K"
              title: "Ship the wizard"
          bugs:
            - id: "BUG-001"
              tier: "K"
              symptom: "it crashes"
          YAML
          out="$(python tools/mizan_validate.py "$tmp" || true)"
          echo "$out"
          for rule in "R8: feature" "R8: bug" "R13:" "R14:" "R15:"; do
            echo "$out" | grep -q "$rule" || { echo "FAIL: $rule did not fire" >&2; exit 1; }
          done
          echo "OK: R8 (features+bugs), R13, R14 and R15 all fired."
          # ...and the migration promise holds: the same file at 1.2 is
          # unenforced, so existing registries do not break on upgrade.
          sed -i 's/schema_version: "1.3"/schema_version: "1.2"/' "$tmp"
          python tools/mizan_validate.py "$tmp"
          echo "OK: the same registry at 1.2 stays valid and unenforced."

      - name: Self-test — R4 must catch a deleted entry
        run: |
          set -e
          # A baseline that is never compared against is the same as no
          # baseline. This proves the wiring end to end: delete a hypothesis
          # from a tracked registry in the worktree and require R4 to fire.
          reg="examples/mizan-registry.example.yaml"
          cp "$reg" /tmp/reg.bak
          python - <<'PY'
          import re
          p = "examples/mizan-registry.example.yaml"
          s = open(p, encoding="utf-8").read()
          # drop the whole hypotheses block -> every prior entry disappears
          s = re.sub(r"(?ms)^hypotheses:.*?(?=^experiments:)", "hypotheses: []\n\n", s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          out="$(python tools/mizan_validate.py --against HEAD "$reg" || true)"
          cp /tmp/reg.bak "$reg"
          echo "$out"
          echo "$out" | grep -q "R4:" || { echo "FAIL: R4 did not fire on a deleted entry" >&2; exit 1; }
          echo "OK: R4 caught the deletion."

      - name: Self-test — validator must FAIL on a broken registry
        run: |
          set -e
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: t, owner: t, schema_version: "1.1", methodology: m, created: "2026-01-01"}
          hypotheses:
            - id: H-1
              tier: K
              threshold: {support: ">=1", refute: "<1"}
              refutation: "x"
              confounds: []
          experiments: []
          results:
            - id: R-1
              experiment: E-1
              hypothesis: H-1
              measured: "x"
              decision: "propose H->K"
              honesty_annexes: []        # R5 (empty) + R7 (K without confirmation)
          YAML
          out="$(python tools/mizan_validate.py "$tmp" || true)"
          echo "$out"
          # By name, not by exit code: this fixture is deliberately broken in
          # two ways at once, and a bare non-zero exit cannot tell whether
          # both rules still fire or some third rule is covering for them.
          echo "$out" | grep -q "R5: result R-1" || { echo "FAIL: R5 did not fire on the empty honesty_annexes" >&2; exit 1; }
          echo "$out" | grep -q "R7: hypothesis H-1" || { echo "FAIL: R7 did not fire on the unconfirmed K promotion" >&2; exit 1; }
          echo "$out" | grep -q "^2 violation(s) found." || { echo "FAIL: the fixture tripped a rule other than R5/R7; it no longer isolates them." >&2; exit 1; }
          echo "OK: R5 and R7 both fired, and nothing else did."

      - name: Self-test — R8 must reject an arbiter-less 1.2 registry
        run: |
          set -e
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: t, owner: t, schema_version: "1.2", methodology: m, created: "2026-01-01"}
          hypotheses:
            - id: H-1
              tier: H
              threshold: {support: ">=1", refute: "<1"}
              refutation: "x"
          YAML
          out="$(python tools/mizan_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "R8: hypothesis H-1 has no arbiter block" || { echo "FAIL: R8 did not fire on the arbiter-less registry" >&2; exit 1; }
          echo "$out" | grep -q "^1 violation(s) found." || { echo "FAIL: the fixture tripped a rule other than R8; it no longer isolates R8." >&2; exit 1; }
          echo "OK: R8, and only R8, rejected the arbiter-less registry."

      - name: The blank form carries none of the worked example's content
        run: |
          set -e
          # An equality check (templates/ vs schemas/) catches drift. It cannot
          # catch the opposite leak: someone edits the blank form while looking
          # at the filled one and the shipped template goes out carrying a real
          # project's names. That failure is silent -- the template still parses,
          # still validates, and quietly hands the next user someone else's data.
          #
          # Borrowed from Kayforkind/reimagine-it, whose CI asserts that one
          # example pack contains none of another's motifs. Same shape, this
          # repo's axis: proper nouns travel, blank forms must not.
          #
          # Currently clean -- this is a guard, not a repair.
          python - <<'PY'
          import io, re, sys
          tpl = io.open("templates/mizan-registry.yaml", encoding="utf-8").read()
          ex = io.open("examples/mizan-registry.example.yaml", encoding="utf-8").read()

          # Distinctive names from the worked example: the project/product it
          # audits, plus any capitalised multi-word proper noun it introduces.
          names = set()
          for pat in (r'project: *"?([^"\n]{3,40})', r'product: *"?([^"\n]{3,40})'):
              names |= {m.strip().strip('"') for m in re.findall(pat, ex)}
          names = {n for n in names if len(n) > 3 and not n.startswith("<")}
          if not names:
              print("no project/product name in the worked example to check against")
              sys.exit(0)

          leaked = sorted(n for n in names if n in tpl)
          if leaked:
              print("FAIL: the blank form carries the worked example's names:", file=sys.stderr)
              for n in leaked:
                  print(f"  - {n!r} appears in templates/mizan-registry.yaml", file=sys.stderr)
              print("A template is a form, not a copy of somebody's filled-in registry.", file=sys.stderr)
              sys.exit(1)
          print(f"ok  blank form carries none of {sorted(names)}")
          PY

      - name: Self-test — R17 must force a decision on an entry that stopped moving
        run: |
          set -e
          # The quietest way a registry rots: nobody writes a false [K], the
          # entries just stop moving, and a year later a preregistered-and-
          # never-tested hypothesis is indistinguishable from a sketch. R17 is
          # the deadline that makes that visible. --as-of pins the date so this
          # test does not depend on when CI happens to run.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: t, owner: t, schema_version: "1.6", methodology: m, created: "2026-01-01"}
          hypotheses:
            - id: H-1
              tier: H
              status: "preregistered"
              preregistered: "2026-01-05"
              formal: "a claim"
              two_sided: "either way it teaches"
              metric: {name: m, instrument: "eval.py"}
              arbiter: {class: instrument, who: "eval.py", independent_of_author: true, calibration: "seed-to-seed spread on this script"}
              threshold: {support: ">=1", refute: "<1"}
              refutation: "x"
              prior_art: "no known relatives"
              cost: "1h"
          YAML

          # structural half: open, with no deadline at all
          out="$(python tools/mizan_validate.py --as-of 2026-08-24 "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "R17: hypothesis H-1 is open" || { echo "FAIL: R17 did not require a review_by on an open entry" >&2; exit 1; }

          # temporal half: a deadline that has passed, with nothing decided
          sed -i 's|    preregistered: "2026-01-05"|    preregistered: "2026-01-05"\n    review_by: "2026-03-01"|' "$tmp"
          out="$(python tools/mizan_validate.py --as-of 2026-08-24 "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "R17: hypothesis H-1 passed its review_by" || { echo "FAIL: a passed deadline with no decision did not fire R17" >&2; exit 1; }
          echo "OK: R17 fires on a missing deadline and on a passed one."

          # ...and each of the three ways out clears it.
          for way in 'review_by: "2026-12-31"' 'status: "dormant"' 'status: "closed"'; do
            cp "$tmp" "$tmp.try"
            case "$way" in
              review_by*) sed -i 's|review_by: "2026-03-01"|review_by: "2026-12-31"|' "$tmp.try" ;;
              *)          sed -i "s|status: \"preregistered\"|${way}|" "$tmp.try" ;;
            esac
            out="$(python tools/mizan_validate.py --as-of 2026-08-24 "$tmp.try" || true)"
            if echo "$out" | grep -q "R17:"; then
              echo "FAIL: R17 still fires after: $way" >&2; echo "$out" >&2; exit 1
            fi
          done
          echo "OK: extend, park and close each clear R17 — silence is the only thing that does not."

          # A deadline nobody can compare against is not a deadline.
          sed -i 's|review_by: "2026-03-01"|review_by: "March 2026"|' "$tmp"
          out="$(python tools/mizan_validate.py --as-of 2026-08-24 "$tmp" || true)"
          echo "$out" | grep -q "is not an ISO date" || { echo "FAIL: a non-ISO review_by was accepted" >&2; exit 1; }
          echo "OK: R17 rejects a date it cannot compare."

      - name: Self-test — R18 must reject an incomplete preregistration
        run: |
          set -e
          # A preregistration that does not say what it locked, locked nothing.
          # The load-bearing field is data_status: a date in `preregistered`
          # means nothing if the numbers were already on screen when it was
          # written, and that date is the whole claim the entry makes.
          #
          # The first draft of this rule read only a BOOLEAN `preregistered`
          # and so never fired on the worked example, which writes a date --
          # the rule was blind to exactly the entries it exists for. That is
          # why this runs against the shipped example rather than a fixture
          # written to match the code.
          python - <<'PY'
          import io, subprocess, sys

          SRC = "examples/mizan-registry.example.yaml"
          base = io.open(SRC, encoding="utf-8").read()

          def drop_line(text, needle):
              keep = [l for l in text.splitlines(keepends=True) if needle not in l]
              assert len(keep) < len(text.splitlines()), "fixture line not found: " + needle
              return "".join(keep)

          def run(text, name):
              p = "/tmp/r18-" + name + ".yaml"
              io.open(p, "w", encoding="utf-8").write(text)
              r = subprocess.run([sys.executable, "tools/mizan_validate.py", p],
                                 capture_output=True, text=True)
              return r.returncode, r.stdout + r.stderr

          code, out = run(base, "clean")
          if code != 0:
              print("FAIL: the shipped example does not pass R18")
              print(out)
              sys.exit(1)
          print("ok  the worked example passes")

          cases = {
              "no-data-status": (
                  drop_line(base, 'data_status:'),
                  "does not say whether the data already exists"),
              "seen-data": (
                  base.replace('data_status: "not_collected"',
                               'data_status: "exists_seen"'),
                  "cannot be preregistered"),
              "bad-value": (
                  base.replace('data_status: "not_collected"',
                               'data_status: "maybe"'),
                  "which is not one of"),
              "no-stopping-rule": (
                  base.replace("    stopping_rule: >", "    _was_stopping: >"),
                  "no stopping rule"),
              "no-exclusion-rule": (
                  base.replace("    exclusion_rule: >", "    _was_exclusion: >"),
                  "names no exclusion rule"),
          }
          for name, pair in cases.items():
              text, expect = pair
              code, out = run(text, name)
              if code == 0:
                  print("FAIL: R18 passed an incomplete preregistration: " + name)
                  sys.exit(1)
              if expect not in out:
                  print("FAIL: " + name + " failed, but not for the stated reason.")
                  print("expected to see: " + expect)
                  print(out)
                  sys.exit(1)
              print("ok  fires on: " + name)

          # The migration gate: the same broken registry at 1.6 must PASS, the
          # way R17 waited for 1.6 and R8 for 1.2. A rule that fires on every
          # registry written before it existed is a rule people delete.
          old = drop_line(base.replace('schema_version: "1.7"',
                                       'schema_version: "1.6"'), 'data_status:')
          code, out = run(old, "migration")
          if code != 0:
              print("FAIL: R18 fired on a 1.6 registry; the migration gate is not holding")
              print(out)
              sys.exit(1)
          print("ok  R18 waits for schema 1.7, the way R17 waited for 1.6")
          PY

      - name: The declared schema version agrees with the schema itself
        run: |
          set -e
          # reimagine-it keeps five host manifests honest by refusing to build
          # when they disagree on a version. Same idea, one repo: the version is
          # stated once in the schema's own banner, echoed in SKILL.md
          # frontmatter, and CI refuses to let the two drift. This repo is why
          # the check earns its place -- the banner said v1.0 for three releases
          # while the file's own version history documented through 1.5.
          python - <<'PY'
          import io, re, sys, yaml
          schema = io.open("skill/mizan/schemas/mizan-registry.yaml", encoding="utf-8").read()
          banner = re.search(r"Schema v([0-9]+\.[0-9]+)", schema)
          if not banner:
              print("FAIL: the schema has no 'Schema vX.Y' banner to be pinned to", file=sys.stderr)
              sys.exit(1)
          skill = io.open("skill/mizan/SKILL.md", encoding="utf-8").read()
          fm = yaml.safe_load(skill[4:skill.index(chr(10) + "---" + chr(10), 4)])
          declared = str((fm.get("metadata") or {}).get("schema_version") or "")
          if declared != banner.group(1):
              print(f"FAIL: SKILL.md declares schema_version {declared!r} but the schema banner says {banner.group(1)!r}", file=sys.stderr)
              sys.exit(1)
          tpl = io.open("templates/mizan-registry.yaml", encoding="utf-8").read()
          tb = re.search(r"Schema v([0-9]+\.[0-9]+)", tpl)
          if not tb or tb.group(1) != declared:
              print(f"FAIL: templates/ says {tb.group(1) if tb else None!r}, schema says {declared!r} -- the blank form ships the wrong version", file=sys.stderr)
              sys.exit(1)
          print(f"ok  schema v{declared} agrees in schema, template and SKILL.md")
          PY

      - name: Docs claim the rule range the validator actually has
        run: |
          set -e
          # Docs go stale silently. R12 shipped and five doc files still
          # advertised the old range; nothing failed, because a range in prose
          # is not connected to anything. This connects it: the validator is
          # the source of truth, and any file claiming "R1-N" must
          # name the N the validator actually implements.
          #
          # Version-history lines are exempt by design -- "0.1 - initial
          # format; rules R1-R9" is a true statement about
          # the past, and rewriting history to match the present is the
          # opposite of what an append-only family should do.
          python - <<'PY'
          import io, os, re, sys, glob
          src = io.open("tools/mizan_validate.py", encoding="utf-8").read()
          have = sorted({int(n) for n in re.findall(r'"R([0-9]+)[:_]', src)})
          if not have:
              print("FAIL: no R-rules found in the validator", file=sys.stderr)
              sys.exit(1)
          top = max(have)
          print(f"validator implements R1-R{top}")

          bad = []
          for path in [p for p in (glob.glob("docs/**/*.md", recursive=True) + ["README.md", "skill/mizan/SKILL.md", "CONTRIBUTING.md"] + glob.glob("tools/**/*", recursive=True) + glob.glob("skill/**/references/*.md", recursive=True)) if os.path.isfile(p) and "__pycache__" not in p and not p.endswith((".pyc", ".xlsx", ".skill"))]:
              # A changelog entry wraps across lines, so the exemption has to
              # follow the paragraph, not the line: "**v1.0** - ... G1-G6 ..."
              # is true about v1.0 no matter which line the range lands on.
              dated = False
              for i, line in enumerate(io.open(path, encoding="utf-8", errors="replace").read().splitlines(), 1):
                  if not line.strip():
                      dated = False
                  elif re.search(r"\*\*v[0-9]+\.[0-9]+\*\*", line):
                      dated = True
                  if dated:
                      continue
                  # A line that dates itself is a statement about the past --
                  # a changelog entry, a schema version-history line, a dated
                  # revision note. Rewriting those to match the present is the
                  # falsification an append-only family refuses.
                  if (re.match(r"\s*#?\s*[0-9]+\.[0-9]+\s+[-\u2014]", line)
                          or re.search(r"\*\*v[0-9]+\.[0-9]+\*\*", line)
                          or re.search(r"Revised\s+[0-9]{4}-[0-9]{2}-[0-9]{2}", line)):
                      continue
                  for claimed in re.findall(r"R1\s*[\u2013-]\s*R([0-9]+)", line):
                      if int(claimed) != top:
                          bad.append(f"{path}:{i} claims R1-R{claimed}, validator has R1-R{top}")
          if bad:
              print("FAIL: docs advertise a rule range the validator does not have:", file=sys.stderr)
              for b in bad:
                  print("  -", b, file=sys.stderr)
              sys.exit(1)
          print(f"ok  every rule-range claim says R1-R{top}")
          PY

      - name: No real name reaches what gets published
        env:
          # Set this repository secret to a newline-separated list of names that
          # must never be published: clients, internal products, private repos.
          # Unset, the sweep reports NOT CONFIGURED and passes -- a repository
          # that has not set this up is not a repository that failed.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          set -e
          # From vaddermail/maestro-framework, check 14. The examples here use
          # invented names on purpose; that is the discipline, this is the net.
          # A real name in a tracked file is published the moment it is pushed,
          # and deleting it afterwards does not un-publish it.
          #
          # The tree and the package are swept separately: they are built by
          # different code, so a clean tree does not prove a clean mizan.skill.
          # A hit prints the file, the line and the term's index -- never the
          # term, because this log is public.
          python tools/leak_check.py --package mizan.skill

  skill-package-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: mizan.skill must match skill/mizan/ contents
        run: |
          python - <<'PY'
          import zipfile, os, sys
          def norm(b): return b.replace(b"\r\n", b"\n")
          z = zipfile.ZipFile("mizan.skill")
          names = set(z.namelist())
          bad = []
          # every packaged file must match its source
          for name in names:
              src = os.path.join("skill", name)   # arcname is mizan/... ; source is skill/mizan/...
              if not os.path.exists(src):
                  bad.append(f"{name}: packaged but missing from source"); continue
              if norm(z.read(name)) != norm(open(src, "rb").read()):
                  bad.append(f"{name}: content differs from skill/{name}")
          # every source file must be packaged
          for root, dirs, files in os.walk("skill/mizan"):
              # Build artifacts are not source. Iskele's CI went red on
              # 2026-08-11 because a local __pycache__ reached the package;
              # the guard it grew then belongs in all four repos, not one.
              dirs[:] = [d for d in dirs if d != "__pycache__"]
              for f in files:
                  if f.endswith(".pyc"):
                      continue
                  rel = os.path.relpath(os.path.join(root, f), "skill").replace(os.sep, "/")
                  if rel not in names:
                      bad.append(f"{rel}: in source but not packaged")
          if bad:
              print("mizan.skill is OUT OF SYNC with skill/mizan/:")
              for b in bad: print("  -", b)
              print("\nRebuild it (see CONTRIBUTING.md) and commit.")
              sys.exit(1)
          print("mizan.skill is in sync with skill/mizan/.")
          PY

  skill-scan:
    # A skill is code plus instructions that load into an agent's context and
    # run with the user's permissions, so this repo ships an attack surface,
    # not just a document. This job scans skill/mizan with skillvet
    # (github.com/V3r7ig0/skillvet) and fails on any high/critical finding.
    #
    # skillvet is pinned to a commit, not a branch: an unpinned security
    # scanner is itself a supply-chain hole, and a rule set that changes
    # under us turns a green run into a claim we cannot reproduce. Bumping
    # the pin is a deliberate commit, and the diff in findings is the point
    # of the bump.
    #
    # Only skills/skillvet is checked out. The upstream repo also carries 44
    # deliberately malicious benchmark fixtures; they are inert test data,
    # but there is no reason to put them on a runner, and endpoint AV
    # heuristics flag them on sight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch the pinned scanner (scanner only, no benchmark corpus)
        run: |
          set -e
          git clone --quiet --filter=blob:none --no-checkout https://github.com/V3r7ig0/skillvet.git /tmp/skillvet
          git -C /tmp/skillvet sparse-checkout set --no-cone skills/skillvet
          git -C /tmp/skillvet checkout --quiet 025c8d8dd389fe92dbb21522b51385591653ba5d
          echo "skillvet pinned at $(git -C /tmp/skillvet rev-parse --short HEAD)"

      - name: Scan skill/mizan
        env:
          # The scanner prints a U+2192 in its verdict line; without this it
          # dies on any runner whose stdout is not UTF-8.
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          python /tmp/skillvet/skills/skillvet/scripts/scan_skill.py skill/mizan --fail-on high
