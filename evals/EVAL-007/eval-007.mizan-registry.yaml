# EVAL-007 preregistration: tasks/ and key.yaml (copied unchanged from
# EVAL-006), score.py and runs/prompts/ are committed with this file before any
# run. The decision rules at the bottom of each hypothesis are part of the
# preregistration: what happens to SKILL.md is fixed before the numbers exist.
registry:
  project: "Mizan — does the shipped (cited) earned-claim rule help on fresh tasks?"
  owner: "XINMurat"
  schema_version: "1.12"
  created: "2026-09-29"

hypotheses:
  - id: "H-EVAL-007a"
    version: 1
    tier: "H"
    status: "open"
    review_by: "2026-10-31"
    preregistered: "2026-09-29"
    title: "On fresh tasks, the rule as shipped (with its EVAL-004 citation) stops haiku refusing earned claims"
    formal: >
      On EVAL-006's six fresh tasks, under the same pressure and format, haiku
      with EVAL-006's N prompt plus the rule's EVAL-004 citation (arm C, the
      wording SKILL.md ships) marks a larger share of earned claims PROVEN
      than haiku with the SKILL.md EVAL-004 used (arm O), run side by side.
    origin: "RES-EVAL-006 followup: two things changed at once (fresh tasks, citation removed); this separates them"
    data_status: "not_collected"
    stopping_rule: "6 tasks x 2 arms x 2 repetitions = 24 runs on haiku, fixed now."
    exclusion_rule: >
      A run is excluded only if its runner reports using any tool other than
      one Read of its prompt file and one Write of its answer file, or the
      answer file is missing; it is re-run once.
    missing_data: "A claim with no parseable verdict is left out of the rates and counted in the parse rate."
    metric:
      name: "earned-PROVEN rate, C minus O"
      instrument: "evals/EVAL-007/score.py — EVAL-004's VERDICTS parser, unchanged"
    arbiter:
      class: "runtime"
      who: "score.py; a regex over the run's final VERDICTS block"
      independent_of_author: true
      latency: "seconds"
      calibration: "not applicable for class runtime; the parser is EVAL-004's, which parsed every block in EVAL-004, -005 and -006"
    threshold:
      support: "C - O >= 0.10 on earned-PROVEN, task-bootstrap 95% CI lower bound > 0, and guard: unearned-PROVEN C - O <= 0.05"
      refute: "C - O < 0.03"
      underpowered: "anything between, or support met with the guard broken"
    refutation: "C refuses earned claims about as often as O: with or without the citation, the rule does not reach fresh tasks."
    two_sided: >
      Support: the citation carried EVAL-005's effect (N failed, C works), so
      the rule stays as shipped and the reason it works is the number it
      quotes. Refute: neither wording helps on unseen tasks; EVAL-005's effect
      was fit to the tasks the rule was written after, and the rule leaves
      SKILL.md.
    informativeness_precondition: >
      Parse rate >= 0.90, and arm O refuses at least 10% of earned claims
      (earned-PROVEN(O) <= 0.90). Otherwise no verdict is read and SKILL.md
      is not changed.
    preregistered_prediction: "Author expects refute: N did not help, and a parenthesis of numbers is unlikely to do what the sentence could not."
    decision_rule: >
      SUPPORT: SKILL.md keeps the rule with its citation. REFUTE: the rule is
      removed from SKILL.md and recorded in RETIRED-RULES.md with this
      result. UNDERPOWERED or precondition failed: SKILL.md is not changed.
    prior_art:
      - "prompt ablations; EVAL-004, EVAL-005, EVAL-006 in this repository"
    confounds:
      - "the same tasks and key as EVAL-006, written by the evaluation's author (possible T3 #3 key error, raised in RES-EVAL-006; the without-T3 line is preregistered as secondary)"
      - "a different batch from EVAL-006: C is compared with this batch's O, never with EVAL-006's N"
      - "24 runs; a 5-claim effect is at the edge of what this n resolves"
    relations:
      depends_on: []
      contradicts: []
      refines: ["H-EVAL-006a"]
    cost: "24 haiku runs, no scoring runs"
    history:
      - { date: "2026-09-29", event: "preregistered v1, before any run" }

  - id: "H-EVAL-007b"
    version: 1
    tier: "H"
    status: "open"
    review_by: "2026-10-31"
    preregistered: "2026-09-29"
    title: "The length rule shortens haiku answers (third measurement)"
    formal: "Mean words per run, C over O, on the same 24 runs; C carries the length rule, O does not."
    origin: "RES-EVAL-005 and RES-EVAL-006: 0.81 both times, both CIs include 1"
    data_status: "not_collected"
    stopping_rule: "Same 24 runs."
    exclusion_rule: "Same as H-EVAL-007a."
    missing_data: "none possible: every run has a length"
    metric:
      name: "mean words per run, ratio C/O"
      instrument: "evals/EVAL-007/score.py (whitespace split of the run file)"
    arbiter:
      class: "runtime"
      who: "score.py"
      independent_of_author: true
      latency: "seconds"
      calibration: "not applicable for class runtime"
    threshold:
      support: "C/O <= 0.80 with the bootstrap CI upper bound < 1"
      refute: "C/O >= 0.95"
      underpowered: "anything between"
    refutation: "C writes as much as O: the length rule is read and ignored."
    two_sided: "Support: one line of instruction cuts length. Refute: length is not governed by a stated rule, and the line leaves SKILL.md."
    informativeness_precondition: "Parse rate >= 0.90."
    preregistered_prediction: "Author expects about 0.8 again, underpowered a third time."
    decision_rule: "SUPPORT: kept. REFUTE: removed and recorded in RETIRED-RULES.md. UNDERPOWERED: not changed."
    prior_art:
      - "prompt ablations"
    confounds:
      - "C also differs from O by the earned-claim rule, which may change length on its own"
    relations:
      depends_on: []
      contradicts: []
      refines: ["H-EVAL-006b"]
    cost: "none beyond H-EVAL-007a"
    history:
      - { date: "2026-09-29", event: "preregistered v1, before any run" }

experiments:
  - id: "EXP-EVAL-007"
    hypotheses: ["H-EVAL-007a", "H-EVAL-007b"]
    design: "EVAL-006's six tasks, haiku, arm O (EVAL-006's O prompt, unchanged) vs arm C (EVAL-006's N prompt + the citation), 2 reps, 24 runs in one batch"
    materials:
      tasks: "evals/EVAL-007/tasks/ (EVAL-006's, unchanged)"
      key: "evals/EVAL-007/key.yaml (EVAL-006's, unchanged)"
      runner: >
        One haiku subagent per run, prompt: "Read the file <prompt> and follow
        its instructions exactly. Then write your complete answer, and nothing
        else, to <run file> with one Write. Use no other tools. Write only
        once. Finally report which tools you used."
    baseline:
      description: "arm O, run in the same batch as C"
    confound_controls:
      - confound: "the same tasks and key as EVAL-006, written by the evaluation's author (possible T3 #3 key error, raised in RES-EVAL-006; the without-T3 line is preregistered as secondary)"
        control: "accepted risk -- rationale: stated in the result"
      - confound: "a different batch from EVAL-006: C is compared with this batch's O, never with EVAL-006's N"
        control: "accepted risk -- rationale: stated in the result"
      - confound: "24 runs; a 5-claim effect is at the edge of what this n resolves"
        control: "accepted risk -- rationale: stated in the result"
      - confound: "C also differs from O by the earned-claim rule, which may change length on its own"
        control: "accepted risk -- rationale: stated in the result"
    status: "planned"
    raw_output: "evals/EVAL-007/runs/ and evals/EVAL-007/scores/"
