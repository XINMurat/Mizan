# =====================================================================
# Example Mizan registry — passes tools/mizan_validate.py (R1–R16 clean)
# Örnek Mizan registry'si — doğrulayıcıdan temiz geçer (R1–R16)
# =====================================================================
# NOTE ON THE VERSION BUMP (2026-08-20). This file declared
# schema_version 1.1 while claiming to be "R1-R8 clean". It was not: R8 is
# gated on 1.2, so the arbiter rule never ran here, and H-001 carried no
# arbiter block at all. The header claim was true only because the check
# was switched off — this repo's own [Y] tier, in its own example file.
# Fixed by declaring 1.3, giving H-001 the arbiter it always needed, and
# adding the worked FEAT/BUG entries the 1.3 schema defines. Now at 1.4,
# which additionally requires evidence behind [K] (R9), numeric thresholds
# (R10), a tier on every entry (R11) and the mandatory entry fields (R12).
# H-001 satisfies R9 through RES-001, not by assertion.
# =====================================================================
registry:
  project: "ExampleLM"
  owner: "your-org"
  schema_version: "1.7"
  methodology: "mizan-v2.2"
  created: "2026-07-11"
  notes: >
    Worked example showing a full hypothesis → experiment → result cycle
    that satisfies every hard rule, including a surprising-positive that
    correctly waits for its symmetric control before promotion.

hypotheses:
  - id: "H-001"
    version: 1
    tier: "K"
    status: "closed"
    preregistered: "2026-07-11"
    title: "Input-dependent phase improves perplexity"
    formal: >
      Adding an input-dependent phase term to the projection lowers
      validation perplexity relative to a parameter-matched baseline.
    origin: "user intuition + prior SpectralLM note"
    # R18 -- what the preregistration actually locked. data_status is the
    # load-bearing one: this entry claims a date, and a date means nothing if
    # the numbers were already on screen when it was written.
    data_status: "not_collected"
    stopping_rule: >
      Three seeds per arm, fixed in advance. No "one more seed" -- the spread
      across those three is what the support bar was calibrated against.
    exclusion_rule: >
      None. Every completed run counts, including diverged ones; a diverged run
      is a result about the method, not a data-quality problem.
    missing_data: >
      A crashed run is re-launched once with the same seed; a second crash is
      recorded as "precondition failed", which is its own outcome and not [R].
    metric:
      name: "perplexity_improvement"
      instrument: "eval/ppl.py on WikiText-2 val"
    arbiter:
      class: "instrument"
      who: "eval/ppl.py — the number does not pass through the author's judgement"
      independent_of_author: true
      latency: "hours"
      calibration: >
        Seed-to-seed spread of the parameter-matched baseline on this same
        script and dataset; the 5% support bar sits outside it. Not
        inherited from any other benchmark.
    threshold:
      support: ">= 5%"
      refute: "< 1%"
      underpowered: "1%..5% -> one rerun with a second seed"
    refutation: >
      A gain below 1%, or a gain that a phase-free control reproduces,
      kills the 'geometry matters' reading.
    two_sided: >
      Support: phase term earns its place. Refute: the projection budget,
      not the phase, carries the gain — cheaper design wins.
    informativeness_precondition: >
      Both arms must actually learn the task (val loss below random).
    preregistered_prediction: "Owner expects a real but small (~3-6%) gain."
    prior_art:
      - "Fourier/phase features in sequence models"
    confounds:
      - parameter_count
      - initialization
    relations:
      depends_on: []
      contradicts: []
      refines: []
    cost: "~1 GPU-day"
    history:
      - { date: "2026-07-11", event: "preregistered v1" }
      - { date: "2026-07-11", event: "H->K confirmed after symmetric control (see RES-001)" }

experiments:
  - id: "EXP-001"
    hypotheses: ["H-001"]
    design: >
      Train phase-augmented vs. parameter-matched vanilla arm; compare
      validation perplexity. Run the amplitude-routed control as the
      symmetric check for the surprising positive.
    materials:
      dataset: "WikiText-2"
      model: "ExampleLM-small"
      seeds: [42, 7]
      config: "configs/exp001.yaml"
    baseline:
      description: "Parameter-matched vanilla variant (±1% params)"
    confound_controls:
      - confound: parameter_count
        control: "both arms matched to ±1% params"
      - confound: initialization
        control: "two seeds (42, 7); variance reported in honesty annexes"
    status: "completed"
    raw_output: "runs/exp001/"

results:
  - id: "RES-001"
    experiment: "EXP-001"
    hypothesis: "H-001"
    date: "2026-07-11"
    measured: >
      Phase arm: -6.75% ppl vs baseline (mean over seeds 42,7).
      Amplitude-routed control: -6.5% ppl vs baseline.
    threshold_met: "yes"
    surprising_positive: true
    confound_control_result: >
      Amplitude-routed control reproduced ~96% of the gain, so the effect
      is generic input-conditioning capacity, NOT phase geometry. The
      'geometry matters' headline is refuted; the perplexity gain itself
      is real and survives, hence H stays supported for the gain claim.
    # v1.1 optional structured statistics (opt-in; see schema)
    statistics:
      effect_size: "-6.75% ppl (relative)"
      n: "2 seeds"
      uncertainty: "±0.4% across seeds"
      seeds_variance: "42: -6.9%, 7: -6.6%"
    decision: "propose H->K"
    decision_confirmed_by: "owner (2026-07-11 audit pass)"
    honesty_annexes:
      - "n=1 dataset (WikiText-2), 2 seeds only"
      - "instrument dependence: ppl.py tokenizer; other tokenizers untested"
      - "control shows the 'phase geometry' framing does not hold"
    post_hoc_reasoning: >
      not preregistered: the amplitude control was designed after seeing
      the surprising 6.75% — added as a sub-check per R6.
    followup: []

# ---------------------------------------------------------------------
# BUG (Mode 4) — the entry is a hypothesis about a MECHANISM, so `formal`
# carries the mechanism and `symptom` stays interpretation-free.
# ---------------------------------------------------------------------
bugs:
  - id: "BUG-001"
    tier: "H"
    status: "preregistered"
    preregistered: "2026-07-12"
    title: "Loss spikes around step 4k on multi-GPU runs"
    formal: >
      The spike is caused by the gradient all-reduce running before the
      phase projection's buffer is synchronised (train/ddp.py:118), so one
      rank contributes a stale projection for exactly one step.
    symptom: >
      "train/loss jumps 2.31 -> 5.87 at step 4013, recovers by 4030.
      Reproduced on 3 of 5 runs, 2 GPUs. Single-GPU runs: never observed."
    rival_hypotheses:
      - >
        A data-loader boundary: the spike coincides with the shard rollover,
        and a malformed batch would produce the same shape. Distinguished by
        replaying the exact batch on a single GPU.
      - >
        Ordinary LR-schedule instability at the warmup/decay junction, which
        happens to sit near step 4k. Distinguished by moving the junction to
        step 6k and seeing whether the spike moves with it.
    arbiter:
      class: "runtime"
      who: "tests/test_ddp_sync.py::test_projection_buffer_synced (repro script)"
      independent_of_author: true
      latency: "seconds"
      calibration: "not applicable for class runtime — the repro either fires or does not"
    threshold:
      support: "repro fails before the fix and passes after, 10/10 runs"
      refute: "repro is flaky across 10 runs, or the spike survives the fix"
    refutation: >
      If reverting the fix does NOT reproduce the spike, the mechanism is
      unconfirmed and the entry is KKE, not K — a fix that works from an
      unrelated location refutes the mechanism while curing the symptom.
    two_sided: >
      Confirmed: the DDP buffer ordering is the mechanism, and the same
      pattern is worth checking wherever else a projection buffer crosses an
      all-reduce. Refuted: the spike is not a sync bug, which promotes the
      shard-rollover rival and makes the data loader the next place to look.
      Either way the next step is defined before the test runs.
    metric:
      name: "repro_pass_rate"
      instrument: "tests/test_ddp_sync.py, 10 consecutive runs on 2 GPUs"
    prior_art:
      - >
        Two earlier entries in this project were DDP ordering bugs
        (BUG-M004, BUG-M009). That is the reason this mechanism was the
        first hypothesis rather than the third — and also the reason the
        rivals below are written out: a project's favourite explanation is
        the one most in need of a competitor.
    cost: "~half a day"
    history:
      - { date: "2026-07-12", event: "preregistered with two rivals" }

# ---------------------------------------------------------------------
# FEATURE (Mode 5) — the value metric IS `metric`, the success threshold
# IS `threshold`, so R1 and R8 apply without a second implementation.
# ---------------------------------------------------------------------
features:
  - id: "FEAT-001"
    tier: "H"
    status: "preregistered"
    preregistered: "2026-07-12"
    title: "Ship input-conditioning on by default"
    formal: >
      Enabling input-dependent conditioning by default lowers perplexity for
      users who never touch the flag, without a training-throughput
      regression that outweighs it.
    problem_claim:
      claim: "Users keep the default config and never discover the flag."
      tier: "H"
      source: >
        14 of 17 configs in the examples/ directory and in three external
        forks are unmodified defaults. Suggestive, not decisive: forks may
        be unrepresentative, hence H rather than K.
    metric:
      name: "default_config_perplexity"
      instrument: "eval/ppl.py on the released default config, per nightly build"
    arbiter:
      class: "instrument"
      who: "the nightly eval job; the author does not decide whether it passed"
      independent_of_author: true
      latency: "days"
      calibration: >
        Null is the current default config's own nightly spread over 14 runs.
    threshold:
      support: ">= 4% relative ppl improvement on the default config"
      refute: "< 1%, or a > 15% training-throughput regression at equal ppl"
      underpowered: "1-4% -> extend to 30 nightly runs before deciding"
    kill_condition: >
      If, 8 weeks after release, the flag is explicitly disabled in more
      than 30% of observed configs, the default is wrong and gets reverted —
      an opt-out rate that high means users are paying a cost the eval does
      not measure.
    alternatives:
      - kind: "proposed"
        option: "Enable it by default for everyone."
        cost: "1 day + the migration note; ongoing support for two code paths"
      - kind: "cheaper"
        option: >
          Leave the default alone and put the flag in the quickstart's first
          example. Attacks the same problem claim (users never discover it)
          without changing anyone's numbers underneath them.
        cost: "1 hour"
      - kind: "null"
        option: >
          Do nothing. The problem costs a ~5% ppl improvement that
          default-config users do not get. Against two maintained code paths
          and a silent behaviour change for every existing user, this is a
          real contender and is not listed as a formality.
        cost: "0"
    acceptance_criteria:
      - "FAILS acceptance if the default config's ppl does not improve by >= 4% on the nightly eval."
      - "FAILS acceptance if training throughput drops more than 15% at equal ppl."
      - "FAILS acceptance if the change ships without a migration note stating that existing runs are not comparable."
    refutation: >
      A nightly improvement below 1%, or a throughput regression above 15%,
      kills the value claim. Either outcome is worth knowing: the second
      says the mechanism works but is not free, which changes the default
      decision without touching H-001.
    two_sided: >
      Supported: input-conditioning earns the default, and the two code paths
      get a removal date. Refuted at the throughput bar rather than the ppl
      bar: the mechanism works and is not free, so the honest answer is the
      cheaper alternative (document the flag) rather than a default change —
      a result that redirects the work instead of ending it.
    informativeness_precondition: >
      The nightly eval must actually run on the default config. Until that
      job exists, this feature can only ship as S, and saying so is the
      point of this field.
    prior_art:
      - >
        The same default was flipped and reverted in v0.3 — the revert
        commit says "users reported slower training", with no measurement
        attached. That is exactly the gap the throughput bar in the refute
        threshold closes, and it is why this entry exists rather than a
        straight re-flip.
    cost: "1 day build; two code paths to maintain until the old one is removed"
    history:
      - { date: "2026-07-12", event: "gated, not started" }
