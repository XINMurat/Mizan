- id: YZ-002
  version: 2
  visibility: public
  tier: S
  status: preregistered
  preregistered: '2026-09-06'
  title: Kanit katmanlarinin sabit odule eslenmesi (PRM ikamesi)
  formal: 'Akil yurutme adimlarinin surekli 0-1 PRM skoru yerine kesikli Mizan katmanlarina
    ([K]/[H]/[S]/[KKE]/[R]/[Y]) eslenip sabit odul degerleri almasi, adim-duzeyi hata oranini
    dusurur.

    '
  metric:
    name: adim-duzeyi hata orani
    instrument: harici deterministik dogrulayici (derleyici / Lean / Z3)
  threshold: 'Alti-katman kolu, ikili kolu adim-hata oraninda >= %15 goreli iyilestirirse
    destek; <= %5 ise [R]; arasi guc yetersiz (tek yeniden kosum). Esik bu kosum hattinin
    kendi tohum-arasi yayilimindan turetilir, PRM literaturunun marjlarindan devralinmaz.

    '
  refutation: 'K-01: esit compute ile uc kol -- (a) ikili odul, (b) uc degerli (dogru/yanlis/uydurma),
    (c) alti katman. (c)-(a) farki gurultunun icindeyse katman uzayi egitim acisindan anotasyon
    semasidir, semantik durum uzayi degil -> [R]. IKINCI CURUTME (K-05, ayni kosumdan bedava
    okunur): onerilen sabit kumesi [S] = 0.0 biraktigi icin spekulatif adim CEZASIZDIR ve
    bir guvenli liman yaratir. [S] etiketli adim orani egitim boyunca >= %50 goreli artar
    ve gorev dogrulugu <= %2 oynarsa, YZ-002 ONERILDIGI HALIYLE [R] olur -- katman fikri degil,
    sabit kumesi curur.

    '
  arbiter:
    class: runtime
    judge: birim test / prover kosumu
    latency: kosum basina
  two_sided: 'Permutasyon farki kapatirsa esleme dekoratiftir (bu, sabitleri savunmaya calisan
